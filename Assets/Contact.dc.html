<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preload" href="uploads/ABCArizonaFlareStandardVariable-Trial.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=block" rel="stylesheet">
<style>
@font-face { font-family: "Arizona Flare"; src: url("uploads/ABCArizonaFlareStandardVariable-Trial.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; padding: 0; background: #fff; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
a { color: #000; text-decoration: none; }
a:hover { color: #000; opacity: .7; }
</style>
</helmet>
<main style="font-family: Inter, sans-serif; color: #000; background: #fff;">
  <dc-import name="SiteHeader" current="contact" light="{{ true }}" hint-size="100%,200px"></dc-import>

  <section data-screen-label="Contact intro" style="padding: clamp(40px, 4vw, 84px) clamp(20px, 4.8vw, 100px) clamp(40px, 4vw, 84px);">
    <h1 style="margin: 0; font-family: 'Arizona Flare', serif; font-weight: 400; font-size: clamp(56px, 7.5vw, 120px); line-height: .9; text-transform: uppercase;">Contact Simon</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 12px clamp(32px, 4vw, 84px); margin-top: clamp(32px, 3.4vw, 70px); font-size: clamp(16px, 1.25vw, 20px); line-height: 1.35;">
      <div>Tel: <a href="tel:+447906270798" style="color: #000;">(+44) 07906 270 798</a></div>
      <div>Email: <a href="mailto:simon@simonnathan.com" style="color: #000;">simon@simonnathan.com</a></div>
    </div>
  </section>

  <section data-screen-label="Contact form" style="padding: clamp(24px, 2vw, 40px) clamp(20px, 4.8vw, 100px) clamp(80px, 7vw, 146px);">
    <form onSubmit="{{ submit }}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: clamp(28px, 2.7vw, 56px) clamp(32px, 3vw, 62px); max-width: 1732px;">
      <label style="display: flex; flex-direction: column; gap: 10px; font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Name
        <input required="" name="name" style="background: transparent; border: 0; border-bottom: 1px solid #000; padding: 10px 0; color: #000; font-family: Inter, sans-serif; font-size: clamp(16px, 1.25vw, 20px); letter-spacing: 0; text-transform: none; outline: none;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 10px; font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Email
        <input required="" type="email" name="email" style="background: transparent; border: 0; border-bottom: 1px solid #000; padding: 10px 0; color: #000; font-family: Inter, sans-serif; font-size: clamp(16px, 1.25vw, 20px); letter-spacing: 0; text-transform: none; outline: none;">
      </label>
      <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Subject
        <input name="subject" style="background: transparent; border: 0; border-bottom: 1px solid #000; padding: 10px 0; color: #000; font-family: Inter, sans-serif; font-size: clamp(16px, 1.25vw, 20px); letter-spacing: 0; text-transform: none; outline: none;">
      </label>
      <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Message
        <textarea required="" name="message" rows="6" style="background: transparent; border: 0; border-bottom: 1px solid #000; padding: 10px 0; color: #000; font-family: Inter, sans-serif; font-size: clamp(16px, 1.25vw, 20px); line-height: 1.35; letter-spacing: 0; text-transform: none; outline: none; resize: vertical;"></textarea>
      </label>
      <div style="grid-column: 1 / -1; display: flex;">
        <button type="submit" style="display: flex; align-items: center; justify-content: center; width: clamp(150px, 11.3vw, 235px); height: clamp(52px, 3.65vw, 76px); border: 0; border-radius: 50px; background: #000; color: #fff; font-family: Inter, sans-serif; font-weight: 500; font-size: clamp(18px, 1.33vw, 21.3px); cursor: pointer;">Send</button>
      </div>
    </form>
  </section>

  <dc-import name="SiteFooter" light="{{ true }}" hint-size="100%,480px"></dc-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      submit: e => {
        e.preventDefault();
        const f = new FormData(e.currentTarget);
        const subject = f.get('subject') || ('Website enquiry from ' + f.get('name'));
        const body = f.get('message') + '\n\n' + f.get('name') + '\n' + f.get('email');
        window.location.href = 'mailto:simon@simonnathan.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
    };
  }
}
</script>
</body>
</html>
