<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background: {{ bg }}; color: {{ fg }}; font-family: Inter, sans-serif; padding: clamp(40px, 3.6vw, 75px) clamp(20px, 4.8vw, 100px) clamp(48px, 4.4vw, 92px); overflow: hidden;">
  <div ref="{{ boxRef }}" style="width: 100%; font-family: 'Arizona Flare', serif; font-weight: 400; font-size: {{ fs }}; line-height: .853; white-space: nowrap; display: flex; justify-content: center;"><span ref="{{ textRef }}" style="display: inline-block; transform: translateX({{ dx }});">SIMON NATHAN</span></div>
  <div style="height: 1px; background: {{ fg }}; margin-top: clamp(28px, 2.6vw, 55px);"></div>
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 32px; margin-top: clamp(28px, 2.1vw, 44px);">
    <div style="display: flex; flex-wrap: wrap; gap: 32px clamp(48px, 13.4vw, 280px); font-size: clamp(15px, .905vw, 14.5px); line-height: 1.75;">
      <div style="display: flex; flex-direction: column;">
        <a href="Simon%20Nathan%20Home.dc.html" style="color: {{ fg }};">Home</a>
        <a href="Listen.dc.html" style="color: {{ fg }};">Listen</a>
        <a href="Theatre.dc.html" style="color: {{ fg }};">Theatre</a>
      </div>
      <div style="display: flex; flex-direction: column;">
        <a href="Screen.dc.html" style="color: {{ fg }};">Screen</a>
        <a href="Concerts.dc.html" style="color: {{ fg }};">Concerts</a>
        <a href="Contact.dc.html" style="color: {{ fg }};">Contact</a>
      </div>
      <div style="display: flex; flex-direction: column;">
        <a href="tel:+447906270798" style="color: {{ fg }};">(+44) 07906 270 798</a>
        <a href="mailto:simon@simonnathan.com" style="color: {{ fg }};">simon@simonnathan.com</a>
      </div>
    </div>
    <a href="Contact.dc.html" style="display: flex; align-items: center; justify-content: center; width: clamp(150px, 11.3vw, 235px); height: clamp(52px, 3.65vw, 76px); border-radius: 50px; background: {{ fg }}; color: {{ bg }}; font-weight: 500; font-size: clamp(18px, 1.33vw, 21.3px);">Contact</a>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 480}}">class Component extends DCLogic {
  state = { fs: '11.6vw', dx: '0px' };
  boxRef = React.createRef();
  textRef = React.createRef();
  componentDidMount() {
    this.fit = () => {
      const box = this.boxRef.current, t = this.textRef.current;
      if (!box || !t) return;
      const cs = getComputedStyle(box);
      const W = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const probe = 100;
      const c = document.createElement('canvas').getContext('2d');
      c.font = '400 ' + probe + 'px "Arizona Flare"';
      const m = c.measureText('SIMON NATHAN');
      const ok = document.fonts ? document.fonts.check('100px "Arizona Flare"') : true;
      if (!ok) return;
      const L = m.actualBoundingBoxLeft, R = m.actualBoundingBoxRight;
      const ink = (L + R) > 0 ? L + R : m.width;
      const size = probe * W / ink * 0.998; // fills the line width by design
      const k = size / probe;
      // shift so the ink box starts at the left edge: span starts at advance origin, ink starts at -L
      const inkStartFromCenter = (-L - m.width / 2) * k + (m.width * k) / 2;
      const shift = -(inkStartFromCenter) - ((ink * k) - (m.width * k)) / 2 * 0;
      const s2 = ((m.width - (R - L)) / 2 - (m.width - R)) * k;
      this.setState({ fs: size.toFixed(2) + 'px', dx: ((m.width - R + L) / 2 * k).toFixed(2) + 'px' });
    };
    this.ro = new ResizeObserver(this.fit);
    this.ro.observe(this.boxRef.current);
    document.fonts && document.fonts.ready.then(this.fit);
    this.fit();
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const light = this.props.light ?? false;
    const fg = light ? '#000' : '#fff', bg = light ? '#fff' : '#000';
    return { fg, bg, boxRef: this.boxRef, textRef: this.textRef, fs: this.state.fs, dx: this.state.dx };
  }
}</script>
</body>
</html>
