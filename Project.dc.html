<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preload" href="uploads/ABCArizonaFlareStandardVariable-Trial.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=block" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
@font-face { font-family: "Arizona Flare"; src: url("uploads/ABCArizonaFlareStandardVariable-Trial.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; padding: 0; background: #000; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
a { color: #fff; text-decoration: none; }
a:hover { color: #fff; opacity: .7; }
</style>
</helmet>
<main style="font-family: Inter, sans-serif; color: #fff; background: #000;">
  <dc-import name="SiteHeader" current="{{ section }}" hint-size="100%,200px"></dc-import>

  <section data-screen-label="Project info" style="padding: clamp(32px, 3.4vw, 70px) clamp(20px, 4.8vw, 100px) clamp(40px, 4vw, 84px);">
    <a href="{{ backHref }}" style="display: inline-flex; font-size: clamp(14px, .98vw, 15.7px); font-weight: 500; color: #fff;">← {{ backLabel }}</a>
    <h1 style="margin: clamp(28px, 3vw, 62px) 0 0; font-family: 'Arizona Flare', serif; font-weight: 400; font-size: clamp(44px, 5.6vw, 89.6px); line-height: .95; text-transform: uppercase; max-width: 1600px; text-wrap: balance;">{{ title }}</h1>
    <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: clamp(10px, 1vw, 20px); font-family: 'Arizona Flare', serif; font-size: clamp(20px, 1.9vw, 30.4px); line-height: 1.1; text-transform: uppercase;">{{ sub }}</div>
    </sc-if>
    <div style="display: flex; flex-wrap: wrap; gap: 28px clamp(32px, 3vw, 62px); margin-top: clamp(32px, 3.4vw, 70px); max-width: 1732px;">
      <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 4px; font-size: clamp(16px, 1.25vw, 20px); line-height: 1.35;">
        <sc-for list="{{ credits }}" as="c" hint-placeholder-count="2">
          <div>{{ c }}</div>
        </sc-for>
      </div>
      <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 1.35em; font-size: clamp(16px, 1.25vw, 20px); line-height: 1.35;">
        <sc-if value="{{ hasVenue }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; text-wrap: pretty;">{{ venue }}</p>
        </sc-if>
        <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; color: rgb(140,140,140); text-wrap: pretty;">{{ note }}</p>
        </sc-if>
      </div>
    </div>
  </section>

  <section data-screen-label="Project media" style="padding: 0 clamp(20px, 4.8vw, 100px) clamp(64px, 6vw, 125px);">
    <div onMouseEnter="{{ showUi }}" onMouseMove="{{ showUi }}" onMouseLeave="{{ hideUi }}" style="position: relative; aspect-ratio: 16 / 9; background: rgb(17,17,17); overflow: hidden;">
      <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
        <iframe ref="{{ frameRef }}" onLoad="{{ frameLoad }}" src="{{ embed }}" title="{{ title }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" referrerpolicy="strict-origin-when-cross-origin" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0;"></iframe>
        <a href="{{ watchUrl }}" target="_blank" rel="noopener" aria-label="Watch on YouTube" style="position: absolute; left: 0; right: 0; top: 0; height: 72px; z-index: 1;" style-hover="opacity: 1;"></a>
        <a href="{{ watchUrl }}" target="_blank" rel="noopener" aria-label="Watch on YouTube" style="position: absolute; right: 0; bottom: 0; width: 160px; height: 64px; z-index: 1;" style-hover="opacity: 1;"></a>
        <button onClick="{{ toggleSound }}" onMouseEnter="{{ holdUi }}" onMouseLeave="{{ showUi }}" style="position: absolute; right: 20px; bottom: 76px; z-index: 2; opacity: {{ uiOp }}; pointer-events: {{ uiPe }}; transition: opacity .4s ease; display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border: 0; border-radius: 50px; background: #fff; color: #000; font-family: Inter, sans-serif; font-weight: 500; font-size: 15px; cursor: pointer;">{{ soundLabel }}</button>
      </sc-if>
      <sc-if value="{{ noVideo }}" hint-placeholder-val="{{ false }}">
        <image-slot id="{{ slot }}" shape="rect" src="{{ img }}" placeholder="Project photo" style="position: absolute; inset: 0;"></image-slot>
      </sc-if>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 24px; margin-top: clamp(32px, 3vw, 62px); padding-top: clamp(20px, 1.6vw, 32px); border-top: 1px solid rgb(140,140,140);">
      <a href="{{ prevHref }}" style="display: flex; flex-direction: column; gap: 8px; color: #fff; max-width: 45%;">
        <span style="font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Previous</span>
        <span style="font-family: 'Arizona Flare', serif; font-size: clamp(18px, 1.6vw, 25.6px); line-height: 1.05; text-transform: uppercase;">{{ prevTitle }}</span>
      </a>
      <a href="{{ nextHref }}" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; color: #fff; max-width: 45%;">
        <span style="font-size: clamp(13px, .8vw, 12.8px); letter-spacing: .06em; text-transform: uppercase; color: rgb(140,140,140);">Next</span>
        <span style="font-family: 'Arizona Flare', serif; font-size: clamp(18px, 1.6vw, 25.6px); line-height: 1.05; text-transform: uppercase;">{{ nextTitle }}</span>
      </a>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,480px"></dc-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, unmuted: false, ui: false };
  frameRef = React.createRef();
  componentDidMount() {
    this.onYt = e => {
      if (typeof e.data !== 'string' || e.data.indexOf('onReady') < 0 && e.data.indexOf('infoDelivery') < 0) return;
      const w = this.frameRef.current && this.frameRef.current.contentWindow; if (!w || e.source !== w) return;
      w.postMessage(JSON.stringify({ event: 'command', func: 'unloadModule', args: ['captions'] }), '*');
      w.postMessage(JSON.stringify({ event: 'command', func: 'unloadModule', args: ['cc'] }), '*');
    };
    window.addEventListener('message', this.onYt);
    fetch('projects.json').then(r => r.json()).then(data => this.setState({ data })).catch(() => {});
  }
  renderVals() {
    const d = this.state.data;
    const id = new URLSearchParams(window.location.search).get('id') || this.props.projectId || 'stiletto';
    let section = 'theatre', list = [], idx = 0;
    if (d) {
      for (const k of ['theatre', 'screen']) {
        const i = d[k].findIndex(p => p.id === id);
        if (i >= 0) { section = k; list = d[k]; idx = i; break; }
      }
      if (!list.length) { list = d.theatre; idx = 0; }
    }
    const p = list[idx] || { title: '', credits: [] };
    const m = p.yt && p.yt.match(/[?&]v=([^&]+)/);
    const t = p.yt && p.yt.match(/[?&]t=(\d+)/);
    const prev = list[(idx - 1 + list.length) % list.length] || p;
    const next = list[(idx + 1) % list.length] || p;
    if (p.title) document.title = p.title + ' — Simon Nathan';
    return {
      section,
      backHref: section === 'screen' ? 'Screen.dc.html' : 'Theatre.dc.html',
      backLabel: section === 'screen' ? 'Screen' : 'Theatre',
      title: p.title, sub: p.sub || '', hasSub: !!p.sub,
      venue: p.venue || '', hasVenue: !!p.venue,
      note: p.note || '', hasNote: !!p.note,
      credits: p.credits || [],
      hasVideo: !!m, noVideo: !!d && !m,
      playing: !!m,
      frameRef: this.frameRef,
      watchUrl: p.yt || '',
      frameLoad: () => {
        const w = this.frameRef.current && this.frameRef.current.contentWindow; if (!w) return;
        const send = () => {
          w.postMessage(JSON.stringify({ event: 'listening', id: 1 }), '*');
          w.postMessage(JSON.stringify({ event: 'command', func: 'unloadModule', args: ['captions'] }), '*');
          w.postMessage(JSON.stringify({ event: 'command', func: 'unloadModule', args: ['cc'] }), '*');
        };
        send(); setTimeout(send, 800); setTimeout(send, 2500);
      },
      uiOp: this.state.ui ? 1 : 0,
      uiPe: this.state.ui ? 'auto' : 'none',
      showUi: () => { clearTimeout(this.uiT); if (!this.state.ui) this.setState({ ui: true }); this.uiT = setTimeout(() => this.setState({ ui: false }), 2500); },
      holdUi: () => { clearTimeout(this.uiT); if (!this.state.ui) this.setState({ ui: true }); },
      hideUi: () => { clearTimeout(this.uiT); this.setState({ ui: false }); },
      soundLabel: this.state.unmuted ? 'Mute' : 'Sound on',
      toggleSound: () => {
        const w = this.frameRef.current && this.frameRef.current.contentWindow; if (!w) return;
        const on = !this.state.unmuted;
        w.postMessage(JSON.stringify({ event: 'command', func: on ? 'unMute' : 'mute', args: [] }), '*');
        if (on) w.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [100] }), '*');
        this.setState({ unmuted: on });
      },
      embed: m ? 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&mute=1&loop=1&playlist=' + m[1] + '&enablejsapi=1&cc_load_policy=0&cc_lang_pref=none&hl=en&controls=0&rel=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&origin=' + encodeURIComponent(location.origin) + (t ? '&start=' + t[1] : '') : '',
      slot: 'project-' + (p.id || 'x'),
      img: p.img || 'assets/show-placeholder.jpg',
      prevHref: 'Project.dc.html?id=' + prev.id, prevTitle: prev.title,
      nextHref: 'Project.dc.html?id=' + next.id, nextTitle: next.title
    };
  }
}
</script>
</body>
</html>
